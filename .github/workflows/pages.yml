name: Publicar el sitio de progreso

# Regenera y publica la página de estado del proyecto en GitHub Pages.
# El juego en sí no se publica acá: necesita servidor y base de datos.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'docs/**'
      - 'scripts/construir-sitio.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. No cancela la que está corriendo, para no dejar
# el sitio a medio desplegar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: node scripts/construir-sitio.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
